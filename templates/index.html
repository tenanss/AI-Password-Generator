<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_name }}: generatore di password sicure</title>
    <meta name="description" content="Genera password robuste direttamente sul tuo dispositivo. Nessuna password viene inviata a un server.">
    <meta name="theme-color" content="#0b1120">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/css/app.css?v={{ version }}">
    <script src="/static/js/app.js?v={{ version }}" defer></script>
</head>
<body>
    <main class="card">
        <header class="brand">
            <img src="/static/icons/icon.svg" alt="" width="44" height="44">
            <div>
                <h1>{{ app_name }}</h1>
                <p class="tagline">Password robuste, generate sul tuo dispositivo.</p>
            </div>
        </header>

        <section class="output" aria-label="Password generata">
            <output id="password" class="password">&nbsp;</output>
            <button id="copy" type="button" class="icon-btn" aria-label="Copia la password" title="Copia">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="9" y="9" width="12" height="12" rx="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            </button>
        </section>

        <section class="strength" aria-label="Robustezza">
            <div class="meter" aria-hidden="true"><div id="meter-fill" class="meter-fill"></div></div>
            <p class="strength-row">
                <span id="strength-label" class="strength-label"></span>
                <span id="entropy" class="muted"></span>
            </p>
            <p id="crack-time" class="hint"></p>
        </section>

        <form id="options" class="options" novalidate>
            <div class="field">
                <div class="field-head">
                    <label for="length">Lunghezza</label>
                    <input id="length-number" type="number" min="8" max="64" value="16" inputmode="numeric" aria-label="Lunghezza in caratteri">
                </div>
                <input id="length" type="range" min="8" max="64" value="16">
            </div>

            <fieldset class="checks">
                <legend>Caratteri</legend>
                <label class="check"><input type="checkbox" name="upper" checked><span>Maiuscole <code>A–Z</code></span></label>
                <label class="check"><input type="checkbox" name="lower" checked><span>Minuscole <code>a–z</code></span></label>
                <label class="check"><input type="checkbox" name="digits" checked><span>Numeri <code>0–9</code></span></label>
                <label class="check"><input type="checkbox" name="symbols" checked><span>Simboli <code>!@#$…</code></span></label>
                <label class="check"><input type="checkbox" name="excludeAmbiguous"><span>Escludi caratteri ambigui <code>0 O o 1 l I</code></span></label>
            </fieldset>
        </form>

        <button id="generate" type="button" class="primary">Genera nuova password</button>

        <p class="privacy">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="4" y="11" width="16" height="10" rx="2"></rect>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
            </svg>
            <span>Generata nel browser con la crittografia del dispositivo (Web Crypto). La password non viene mai inviata a un server.</span>
        </p>

        <noscript><p class="hint">Per generare le password è necessario JavaScript.</p></noscript>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
